<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hikay's Universal Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1017; --bg2:#131722; --panel:#181d29; --panel2:#1e2432;
  --line:#2a3143; --gold:#e3b559; --gold-dim:#9c7f45; --ink:#eef1f6; --ink-dim:#9aa4b8;
  --good:#7fc088;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--bg); overflow-x:hidden;
  background-image: radial-gradient(ellipse at top, #171d2b 0%, var(--bg) 60%);
  color:var(--ink); font-family:'Inter',system-ui,sans-serif; font-size:15px; line-height:1.5;
  min-height:100%;
}
header{
  position:sticky; top:0; z-index:5;
  padding:env(safe-area-inset-top,0px) 0 0 0;
  background:var(--bg2);
  border-bottom:1px solid var(--line);
  transition:box-shadow .2s ease;
}
header.compact{box-shadow:0 4px 14px rgba(0,0,0,.35);}
.head-inner{
  max-width:900px; margin:0 auto; padding:18px 20px 14px;
  transition:padding .2s ease;
}
header.compact .head-inner{padding:10px 20px;}
h1{
  font-family:'Inter',system-ui,sans-serif; font-weight:700; font-size:19px; letter-spacing:-.2px;
  color:var(--gold); margin:0 0 4px;
  max-height:30px; opacity:1; overflow:hidden;
  transition:max-height .2s ease, opacity .15s ease, margin .2s ease;
}
header.compact h1{max-height:0; opacity:0; margin:0;}
.sub{
  color:var(--ink-dim); font-size:14px; margin:0 0 14px;
  max-height:20px; opacity:1; overflow:hidden;
  transition:max-height .2s ease, opacity .15s ease, margin .2s ease;
}
header.compact .sub{max-height:0; opacity:0; margin:0;}
#q{
  width:100%; font-family:'Inter',system-ui,sans-serif; font-size:16px; color:var(--ink);
  background:var(--panel); border:1px solid var(--line); border-radius:8px;
  padding:10px 12px; outline:none; transition:border-color .15s ease;
}
#q:focus{border-color:var(--gold-dim);}
#filterBtn{
  margin-top:10px; font-family:'Inter',system-ui,sans-serif; font-size:13px; font-weight:600;
  color:var(--ink-dim); background:var(--panel); border:1px solid var(--line); border-radius:8px;
  padding:7px 12px; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  max-height:34px; opacity:1; overflow:hidden; touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  transition:max-height .2s ease, opacity .15s ease, margin .2s ease, border-color .15s ease, color .15s ease;
}
#filterBtn:hover{border-color:var(--gold-dim); color:var(--ink);}
#filterBtn.active{color:var(--gold); border-color:var(--gold-dim);}
#filterBtn .arrow{font-size:10px; transition:transform .2s ease;}
#filterBtn.active .arrow{transform:rotate(180deg);}
header.compact #filterBtn{max-height:0; opacity:0; margin-top:0; padding-top:0; padding-bottom:0; border-width:0;}
.chips{
  display:flex; flex-wrap:wrap; gap:6px;
  max-height:0; opacity:0; margin-top:0; overflow:hidden;
  transition:max-height .25s ease, opacity .2s ease, margin-top .2s ease;
}
.chips.open{max-height:220px; opacity:1; margin-top:10px;}
header.compact .chips{max-height:0!important; opacity:0!important; margin-top:0!important;}
.chip{
  font-size:13px; padding:5px 10px; border:1px solid var(--line); border-radius:20px;
  color:var(--ink-dim); cursor:pointer; background:var(--panel); user-select:none;
  touch-action:manipulation; -webkit-tap-highlight-color:transparent;
}
.chip.on{background:var(--gold-dim); color:#0d1017; border-color:var(--gold-dim); font-weight:600;}
main{max-width:900px; margin:0 auto; padding:16px 20px 60px;}
.cat{
  font-family:'Inter',system-ui,sans-serif; font-weight:600; font-size:13px; color:var(--gold);
  text-transform:uppercase; letter-spacing:.06em;
  margin:24px 0 8px; padding-bottom:6px; border-bottom:1px solid var(--line);
}
.cat:first-child{margin-top:6px;}
.item.alt .row{background:rgba(255,255,255,.025);}
.row{
  display:flex; gap:10px; align-items:center; padding:9px 10px;
  border-bottom:1px solid var(--line); border-radius:6px; max-width:100%;
}
.row.has-why{cursor:pointer;}
.row.has-why:hover{background:rgba(255,255,255,.04);}
.row .name{
  flex:1 1 auto; color:var(--ink); min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.row .price{
  flex:0 0 auto; color:var(--gold); font-weight:600; font-size:15px; text-align:right;
  font-variant-numeric:tabular-nums; white-space:nowrap;
}
.row .ind{
  flex:0 0 auto; width:16px; text-align:center; color:var(--ink-dim); font-size:15px;
  transition:transform .2s ease;
}
.item.open .row .ind{transform:rotate(180deg); color:var(--gold);}
.desc{
  max-height:0; opacity:0; overflow:hidden; padding:0 10px;
  transition:max-height .25s ease, opacity .2s ease, padding .2s ease;
  border-bottom:1px solid transparent;
}
.item.open .desc{max-height:160px; opacity:1; padding:0 10px 12px 10px; border-bottom-color:var(--line);}
.desc .flex-badge{
  display:inline-block; max-width:100%; box-sizing:border-box;
  color:var(--good); font-size:12px; font-weight:600; background:rgba(127,192,136,.12);
  border:1px solid rgba(127,192,136,.35); border-radius:6px; padding:2px 8px; margin-bottom:6px;
  white-space:normal; overflow-wrap:break-word;
}
.desc p{margin:0; color:var(--ink-dim); font-size:13px; line-height:1.55; overflow-wrap:break-word;}
.count{color:var(--ink-dim); font-size:13px; margin:10px 0 0;}
.empty{color:var(--ink-dim); text-align:center; padding:40px 0; font-size:15px;}
@media (max-width:560px){
  h1{font-size:13px;}
  .row{gap:6px;}
  .row .price{font-size:13px;}
}
</style>
</head>
<body>
<header>
  <div class="head-inner">
    <h1>Hikay's Universal Market</h1>
    <p class="sub">Item pricing guide — search or browse by category</p>
    <input id="q" type="text" placeholder="Search an item, category or note..." autocomplete="off">
    <button id="filterBtn" type="button">Filter by category <span class="arrow">▾</span></button>
    <div class="chips" id="chips"></div>
  </div>
</header>
<main>
  <p class="count" id="count"></p>
  <div id="list"></div>
  <p class="empty" id="empty" style="display:none;">No items match that search.</p>
</main>

const list=document.getElementById('list'), q=document.getElementById('q'),
      countEl=document.getElementById('count'), emptyEl=document.getElementById('empty'),
      chipsEl=document.getElementById('chips'), filterBtn=document.getElementById('filterBtn');

const cats=[...new Set(D.map(r=>r[0]))];
let activeCat=null;

// Only a pure whole number gets comma-formatting and a "g" suffix.
// Anything else ("Varies", "500000+", "250 per 1x", "1k-6k"...) is shown as written.
const isWholeNumber = s => /^\d+$/.test(s);
function priceDisplay(p){ return isWholeNumber(p) ? Number(p).toLocaleString('en-US')+'g' : p; }
function flexDisplay(p){ return isWholeNumber(p) ? Number(p).toLocaleString('en-US') : p; }

    const [cat,name,price,flex,why]=r;
    if(activeCat && cat!==activeCat) return;
    if(term){
      const hay=(cat+' '+name+' '+why).toLowerCase();
      if(!hay.includes(term)) return;
    }
    if(cat!==lastCat){
      const h=document.createElement('div');
      h.className='cat'; h.textContent=cat;
      frag.appendChild(h); lastCat=cat; altToggle=false;
    }
    const hasExtra = !!(why || flex);
    const item=document.createElement('div');
    item.className='item'+(altToggle?' alt':'');
    altToggle=!altToggle;

    const row=document.createElement('div');
    row.className='row'+(hasExtra?' has-why':'');
    row.innerHTML=`<span class="name">${name}</span><span class="price">${priceDisplay(price)}</span>`+
      (hasExtra?`<span class="ind">▾</span>`:'');
    item.appendChild(row);

    if(hasExtra){
      const desc=document.createElement('div');
      desc.className='desc';
      desc.innerHTML=(flex?`<span class="flex-badge">±${flexDisplay(flex)} flexibility</span><br>`:'')+
        (why?`<p>${why}</p>`:'');
      item.appendChild(desc);
      row.addEventListener('click', ()=> item.classList.toggle('open'));
    }

    frag.appendChild(item);
    shown++;
  });
  list.appendChild(frag);
  countEl.textContent = shown+' item'+(shown===1?'':'s');
  emptyEl.style.display = shown? 'none':'block';
}

cats.forEach(c=>{
  const chip=document.createElement('span');
  chip.className='chip'; chip.textContent=c;
  chip.addEventListener('click', ()=>{
    activeCat = activeCat===c ? null : c;
    [...chipsEl.children].forEach(ch=>ch.classList.toggle('on', ch.textContent===activeCat));
    filterBtn.classList.toggle('active', !!activeCat);
    closeChips();
    render();
  });
  chipsEl.appendChild(chip);
});

function closeChips(){
  chipsEl.classList.remove('open');
  // Fallback: force the collapsed state directly in case a browser doesn't
  // pick up the transition purely from the class change.
  chipsEl.style.maxHeight='0px';
  chipsEl.style.opacity='0';
  chipsEl.style.marginTop='0px';
  window.setTimeout(()=>{
    chipsEl.style.maxHeight='';
    chipsEl.style.opacity='';
    chipsEl.style.marginTop='';
  }, 260);
}

filterBtn.addEventListener('click', ()=>{
  chipsEl.classList.toggle('open');
});

q.addEventListener('input', render);
render();

const header=document.querySelector('header');
let ticking=false;
function updateHeader(){
  header.classList.toggle('compact', window.scrollY>4);
  ticking=false;
}
window.addEventListener('scroll', ()=>{
  if(!ticking){ ticking=true; requestAnimationFrame(updateHeader); }
}, {passive:true});
updateHeader();
</script>
</body>
</html>
